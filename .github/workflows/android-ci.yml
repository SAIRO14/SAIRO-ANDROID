name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleDebug :app:testDebugUnitTest \
              --stacktrace \
              --info \
              --no-daemon; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "의존성 다운로드 실패. 10초 후 재시도합니다. ($attempt/3)"
              sleep 10
            fi
          done

          exit 1
